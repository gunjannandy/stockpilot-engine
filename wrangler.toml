# Production: one Worker serves the web build as static assets and the API on one origin.
# Workers Builds deploys the `production` branch (docs/adr/0009-v3-cloudflare-wiring.md).
name = "stockpilot-app"
main = "api/src/worker.ts"
compatibility_date = "2026-11-01"
preview_urls = true
keep_vars = true  # a deploy must not wipe SITE_URL and CF_ACCOUNT_ID set in the dashboard

[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/*"]

[[d1_databases]]
binding = "DB"
database_name = "stockpilot-v3"
database_id = "99ae8d3c-cd34-4134-817a-8f42acf4eee7"
migrations_dir = "api/.generated/migrations"

[vars]
CF_WORKER_NAME = "stockpilot-app"
# The preview Worker's address: the scheduler asks it to reseed its database each night (docs/adr/0009).
PREVIEW_URL = "https://stockpilot-preview.stockpilotgn.workers.dev"

# Duties: cron every 5 minutes queues one message per due duty; the consumer runs one per invocation.
# Worker secrets (set in the dashboard, never here): GITHUB_APP_ID, GITHUB_INSTALLATION_ID, GITHUB_APP_KEY,
# CF_DEPLOY_TOKEN. Dashboard-set plain variables (kept out of git): SITE_URL, CF_ACCOUNT_ID.
# See docs/worker-config.md.
[triggers]
crons = ["*/5 * * * *"]

[[queues.producers]]
binding = "DUTIES"
queue = "stockpilot-duties"

[[queues.consumers]]
queue = "stockpilot-duties"
max_batch_size = 1
