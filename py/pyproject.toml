[project]
name = "stockpilot"
version = "0.1.0"
description = "Stock co-pilot for one Zerodha account"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pyyaml>=6",
  "pyrage>=1.2",
  "yfinance>=1.8.0",
  "pypdf>=7.1.1",
  "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "reportlab>=5.1.0",
    "pytest-xdist>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stockpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/sources", "tests/analysis", "tests/calls", "tests/book", "tests/trades", "tests/jobs", "tests/mechanical"]   # tests mirror src/stockpilot; a few import each other by file name
