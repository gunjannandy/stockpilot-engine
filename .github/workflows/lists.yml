# The lists Job: started only by the Worker's 5-minute tick through workflow_dispatch (every 30 minutes in market hours). Public data only
# (the screen, the calls, the quotes), so no model token and no private repo. Publishes the `lists` dataset through the Worker.
# The steps live in _job.yml, which every Job shares.
name: lists
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Job kind (always lists)
        default: lists
      subject:
        description: Job subject
        default: all
      day:
        description: The Job's day, YYYY-MM-DD (empty = today, IST)
        default: ""
      from:
        description: First day of the range, YYYY-MM-DD
        default: ""
      to:
        description: Last day of the range, YYYY-MM-DD
        default: ""
concurrency:
  group: job-lists
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  lists:
    uses: ./.github/workflows/_job.yml
    with:
      kind: lists
      subject: ${{ inputs.subject || 'all' }}
      day: ${{ inputs.day }}
      from: ${{ inputs.from }}
      to: ${{ inputs.to }}
      timeout-minutes: 10
    secrets:
      INGEST_HMAC_KEY: ${{ secrets.INGEST_HMAC_KEY }}
