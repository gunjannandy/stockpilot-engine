name: fund-holdings
# Public job (runs in stockpilot-engine): the ten biggest fund houses' monthly portfolio files, read into dated ISIN rows
# per fund. Public data only; which stocks the owners hold is matched privately. File addresses come from
# config/fund_house_sources.json (empty until found); with none configured the job publishes nothing and passes.
on:
  schedule:
    - cron: "0 3 12 * *"    # the 12th, 08:30 IST: houses publish by the 10th
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fund-holdings
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - name: Read the portfolio files
        shell: bash
        run: uv run python -m stockpilot.sources.fund_holdings out/files | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish to the data-latest release
        run: |
          [ -d out/files/fund_holdings ] || exit 0
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest data" --notes "Rolling public market data. Nothing private."
          (cd out/files && tar czf ../fund-holdings.tar.gz fund_holdings)
          gh release upload data-latest out/fund-holdings.tar.gz --clobber
