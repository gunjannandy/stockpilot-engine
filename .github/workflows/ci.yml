# Public engine repo. Fixtures only: no secrets, no deploy, read-only token.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  py:
    # Run from the repo root: some tests read config/, prompts/ and schemas/ by relative path.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0       # checks/MOVE-1 rebuilds the layout from the last v2 commit
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      # The contract's JSON Schemas are build output (git-ignored); py tests and checks read them.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: uv sync --frozen --project py
      - name: pytest (py/tests and checks/, plus ops/orchestrator/tests once that folder exists)
        run: |
          paths="py/tests $(ls checks/*.py 2>/dev/null)"
          [ -d ops/orchestrator/tests ] && paths="$paths ops/orchestrator/tests"
          uv run --frozen --project py pytest -c py/pyproject.toml -q -p no:cacheprovider -n auto $paths
  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --project py
      - name: privacy gate
        env:
          PRIVACY_DENY_LIST: ${{ secrets.PRIVACY_DENY_LIST }}
        run: |
          uv run --frozen --project py python tools/gates/run.py privacy
  never-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --project py
      - name: never-order gate
        run: |
          uv run --frozen --project py python tools/gates/run.py never-order
  workflow-triggers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --project py
      - name: workflow-triggers gate
        run: |
          uv run --frozen --project py python tools/gates/run.py workflow-triggers
  contract-additive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --project py
      - name: contract-additive gate
        run: |
          uv run --frozen --project py python tools/gates/run.py contract-additive
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen --project py
      - name: trace gate
        run: |
          uv run --frozen --project py python tools/gates/run.py trace
  check-status:
    # Derives checks/status.json (pending until a check's file is on main) and keeps it as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - run: python3 tools/check-status/status.py --main-ref origin/main --out checks/status.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-status
          path: checks/status.json
  gate:
    # The one required check on main: green only when every safety job is. trace and check-status run for
    # information only; the planner-label gate was removed (owner decision 2026-11-28: no gate may wait on a label).
    needs: [py, ts, privacy, never-order, workflow-triggers, contract-additive]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
