# The facts Job: started only by the Worker's 5-minute tick through workflow_dispatch (weekly). Public data only
# (NSE filings, yfinance), so no model token and no private repo. Publishes the `facts` dataset through the Worker.
# The steps live in _job.yml, which every Job shares.
name: facts
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Job kind (always facts)
        default: facts
      subject:
        description: Job subject
        default: all
      day:
        description: The Job's day, YYYY-MM-DD (empty = today, IST)
        default: ""
      from:
        description: First day of the range, YYYY-MM-DD
        default: ""
      to:
        description: Last day of the range, YYYY-MM-DD
        default: ""
concurrency:
  group: job-facts
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  facts:
    uses: ./.github/workflows/_job.yml
    with:
      kind: facts
      subject: ${{ inputs.subject || 'all' }}
      day: ${{ inputs.day }}
      from: ${{ inputs.from }}
      to: ${{ inputs.to }}
      timeout-minutes: 120
    secrets:
      INGEST_HMAC_KEY: ${{ secrets.INGEST_HMAC_KEY }}
