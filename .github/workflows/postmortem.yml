# The post-mortem Job: the Worker starts it each evening when a missed call has reached its three-month score. Public
# data only: it reads the due calls through the Worker and asks the model once per call for English and Bengali together. The model token is the secret of the protected `models` environment
# (main only); no other workflow can read it. The model worker has one slot, so one model Job runs at a time.
name: postmortem
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Job kind (always postmortem)
        default: postmortem
      subject:
        description: Unused (all)
        default: all
      day:
        description: The Job's day, YYYY-MM-DD (empty = today, IST)
        default: ""
      from:
        description: First day of the range, YYYY-MM-DD
        default: ""
      to:
        description: Last day of the range, YYYY-MM-DD
        default: ""
concurrency:
  group: job-postmortem
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  postmortem:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    environment: models
    env:
      STOCKPILOT_API_URL: https://stockpilot-app.stockpilotgn.workers.dev
      STOCKPILOT_INGEST_KEY: ${{ secrets.INGEST_HMAC_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      JOB_DAY: ${{ inputs.day }}
    steps:
      # Jobs run the code that is live, not the branch the dispatch named.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: production
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: py/uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm install -g @anthropic-ai/claude-code
      - run: uv sync --frozen --project py
      - name: Run the Job
        env:
          SUBJECT: ${{ inputs.subject }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          STOCKPILOT_VERSION: ${{ github.sha }}
        run: |
          args=(--subject "${SUBJECT:-all}")
          [ -n "$FROM" ] && args+=(--from "$FROM")
          [ -n "$TO" ] && args+=(--to "$TO")
          uv run --frozen --project py python -m stockpilot.runtime postmortem "${args[@]}"
