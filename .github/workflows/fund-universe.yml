name: fund-universe
# Public job (runs in stockpilot-engine): AMFI market data only, nothing private. Groups the scheme master into funds,
# loads NAV history since 2006 in windows of at most 90 days (a daily run does at most 40 windows, so the first
# backfill finishes in a few days and later runs only add the newest days), joins TER and AUM, and attaches the
# files to the rolling release `data-latest`. The resume state lives there too.
on:
  schedule:
    - cron: "30 2 * * *"    # 08:00 IST
  workflow_dispatch:
    inputs:
      max_windows:
        description: "Most NAV windows to load this run"
        default: "40"
permissions:
  contents: write
concurrency:
  group: fund-universe
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - name: Restore the resume state
        run: gh release download data-latest -p fund-nav-state.json.gz -D out || true
      - name: Build the fund files
        run: |
          [ -f out/fund-nav-state.json.gz ] && gunzip -f out/fund-nav-state.json.gz
          uv run python -m stockpilot.sources.fund_universe out/files out/fund-nav-state.json "${{ inputs.max_windows || 40 }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check it is not shrunk
        run: |
          python3 - <<'PY'
          import json
          c = json.load(open("out/files/funds/index.json"))["counts"]
          assert c["funds"] > 800 and c["schemes_mapped"] == c["schemes"], c
          PY
      - name: Publish to the data-latest release
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest data" --notes "Rolling public market data. Nothing private."
          gzip -f out/fund-nav-state.json
          (cd out/files && tar czf ../funds.tar.gz funds)
          gh release upload data-latest out/funds.tar.gz out/fund-nav-state.json.gz --clobber
