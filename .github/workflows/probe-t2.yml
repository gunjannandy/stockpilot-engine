name: probe-t2
# Runs on the public stockpilot-engine only (it needs outbound access to GitHub release assets and NSE/Yahoo).
# It uses synthetic data and holds no secrets. Triggered by hand.
on: workflow_dispatch
permissions:
  contents: write   # to create and delete a throwaway release
jobs:
  probes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ORIGIN: https://stockpilotgn.pages.dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: pip install duckdb
      - name: Make a synthetic Parquet file
        run: python -c "import duckdb; duckdb.sql(\"COPY (SELECT i AS day, i*2 AS close FROM range(2000000) t(i)) TO 'probe.parquet' (FORMAT parquet, ROW_GROUP_SIZE 100000)\")"
      - name: Throwaway release
        run: gh release create probe-t2 probe.parquet --title probe-t2 --notes "synthetic probe data" --repo "$GITHUB_REPOSITORY"
      - name: Probe 1, DuckDB through the release redirect
        run: python probes/py/duckdb_probe.py "https://github.com/$GITHUB_REPOSITORY/releases/download/probe-t2/probe.parquet" "SELECT max(close) FROM t WHERE day BETWEEN 1900000 AND 1900010" | tee probe1.json
      - name: Probe 2, CORS on the release asset
        run: |
          set +e
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/probe-t2/probe.parquet"
          FINAL=$(curl -s -o /dev/null -w '%{redirect_url}' "$URL")
          echo "--- GET with Origin and Range"; curl -s -D - -o /dev/null -H "Origin: $ORIGIN" -H "Range: bytes=0-99" "$FINAL" | grep -i -E "^(HTTP|access-control|accept-ranges|content-range)" | tee probe2-get.txt
          echo "--- preflight"; curl -s -D - -o /dev/null -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: range" "$FINAL" | grep -i -E "^(HTTP|access-control)" | tee probe2-options.txt
      - name: Probe 4b, Yahoo and NSE quotes from a runner (the Worker run is a VM step)
        run: |
          set +e
          curl -s -m 20 -H "User-Agent: Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/TCS.NS?range=1d&interval=1m" | head -c 600 | tee probe4-yahoo.txt; echo
      - name: Clean up the release
        if: always()
        run: gh release delete probe-t2 --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: probe-t2, path: "probe*.json\nprobe*.txt" }
