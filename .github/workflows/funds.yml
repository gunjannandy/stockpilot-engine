# The funds Job: started only by the Worker's 5-minute tick through workflow_dispatch, never by a schedule of
# its own. Public data only (AMFI, mfapi.in), so no model token and no private repo. Publishes the `funds`
# dataset through the Worker. The steps live in _job.yml, which every Job shares.
name: funds
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Job kind (always funds)
        default: funds
      subject:
        description: Job subject
        default: all
      day:
        description: The Job's day, YYYY-MM-DD (empty = today, IST)
        default: ""
      from:
        description: First day of the range, YYYY-MM-DD
        default: ""
      to:
        description: Last day of the range, YYYY-MM-DD
        default: ""
concurrency:
  group: job-funds
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  funds:
    uses: ./.github/workflows/_job.yml
    with:
      kind: funds
      subject: ${{ inputs.subject || 'all' }}
      day: ${{ inputs.day }}
      from: ${{ inputs.from }}
      to: ${{ inputs.to }}
      timeout-minutes: 60
    secrets:
      INGEST_HMAC_KEY: ${{ secrets.INGEST_HMAC_KEY }}
