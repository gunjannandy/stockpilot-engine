name: search-index
# Public job (runs in stockpilot-engine): market lists only, nothing private. Rebuilds the search index each morning
# and attaches it to the rolling release `data-latest`; the commit-free release upload also counts as activity.
on:
  schedule:
    - cron: "30 1 * * *"    # 07:00 IST, before the market opens
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: search-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --frozen
      - name: Build the index
        run: uv run python -m stockpilot.sources.search_index out/search/index.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check it is not shrunk
        run: |
          python3 - <<'PY'
          import json
          c = json.load(open("out/search/index.json"))["counts"]
          assert c["NSE_SME"] > 100 and c["BSE"] > 1000, c
          PY
      - name: Publish to the data-latest release
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Latest data" --notes "Rolling public market data. Nothing private."
          cp out/search/index.json out/search-index.json
          gh release upload data-latest out/search-index.json --clobber
