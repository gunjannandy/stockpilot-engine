<title>stockpilot v2 prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,300..800&family=Noto+Sans+Bengali:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_balance_wallet,add,arrow_back,arrow_downward,arrow_upward,block,bookmark,check,chevron_right,close,dark_mode,delete,expand_less,expand_more,fact_check,grid_view,history,info,layers,light_mode,menu,monitor_heart,more_horiz,newspaper,open_in_full,open_in_new,query_stats,rate_review,receipt_long,savings,schedule,search,settings,show_chart,star,sync,table_rows,translate,view_agenda,visibility,wb_sunny&display=block">
<style>
/* stockpilot UI, round 8. Material 3. One page scroll everywhere: the rail and the top bar stay put, nothing else scrolls on its own.
   Layout: navigation (expanded rail with words on wide screens, icon rail in the middle, bottom bar on phones) | page.
   Colour: graphite neutrals, one azure accent; gain / loss / warn kept apart from the accent. */
:root{
  --bg:#F2F4F8; --surf:#FFFFFF; --c1:#F7F9FC; --c2:#EBEFF5; --c3:#DEE4EE; --on:#0B1220; --on2:#3B4556; --line:#C7CFDC; --line2:#E3E8EF;
  --pri:#0B57D0; --onpri:#FFFFFF; --sel:color-mix(in oklab,var(--pri) 11%,var(--surf)); --tonal:#D3E3FD; --ontonal:#041E49;
  --gain:#0A7A3D; --loss:#C42525; --warn:#8F5600; --ongain:#FFFFFF; --onloss:#FFFFFF; --onwarn:#FFFFFF;
  --hold:#3B4556; --onhold:#FFFFFF; --watch:#0B57D0; --onwatch:#FFFFFF;
  --l50:#D35F00; --l200:#5A6578; --shadow:rgba(10,20,40,.14);
  --font:"Google Sans Flex","Noto Sans Bengali",system-ui,sans-serif;
  --spring:linear(0,.009,.035 2.1%,.141 4.4%,.281 6.7%,.723 12.9%,.938 16.7%,1.017 19.4%,1.077 22.4%,1.096 25.6%,1.085 29.1%,1.035 37.3%,1.007 42.5%,.994 49.4%,1.001 62.1%,1);
  --ease:cubic-bezier(.2,0,0,1);
  --nav:240px; --bar:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#090C11; --surf:#10141B; --c1:#13181F; --c2:#192029; --c3:#232B37; --on:#EEF2F8; --on2:#A9B4C6; --line:#323C4C; --line2:#1F2733;
  --pri:#8AB4FF; --onpri:#00214F; --sel:color-mix(in oklab,var(--pri) 14%,var(--surf)); --tonal:#0842A0; --ontonal:#D3E3FD;
  --gain:#3DD68C; --loss:#FF6B6B; --warn:#FFB547; --ongain:#002814; --onloss:#3A0003; --onwarn:#2A1700;
  --hold:#C7D0DE; --onhold:#10141B; --watch:#8AB4FF; --onwatch:#00214F;
  --l50:#FFA24C; --l200:#8C97AA; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#090C11; --surf:#10141B; --c1:#13181F; --c2:#192029; --c3:#232B37; --on:#EEF2F8; --on2:#A9B4C6; --line:#323C4C; --line2:#1F2733;
  --pri:#8AB4FF; --onpri:#00214F; --sel:color-mix(in oklab,var(--pri) 14%,var(--surf)); --tonal:#0842A0; --ontonal:#D3E3FD;
  --gain:#3DD68C; --loss:#FF6B6B; --warn:#FFB547; --ongain:#002814; --onloss:#3A0003; --onwarn:#2A1700;
  --hold:#C7D0DE; --onhold:#10141B; --watch:#8AB4FF; --onwatch:#00214F;
  --l50:#FFA24C; --l200:#8C97AA; --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--on)}
body{font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
a{color:inherit}
.ms{font-family:"Material Symbols Rounded";font-size:22px;line-height:1;font-weight:400;font-style:normal;display:inline-block;width:1em;overflow:hidden;white-space:nowrap;flex:none;
  font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--on2)} .up{color:var(--gain)} .dn{color:var(--loss)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px;border-radius:8px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on2)}
.disp{font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variation-settings:"opsz" 72}
:root[lang=bn] .disp{letter-spacing:0;line-height:1.3}
.state{position:relative;isolation:isolate;cursor:pointer}
.state::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--on);opacity:0;transition:opacity .15s;pointer-events:none}
.state:hover::after{opacity:.05} .state:active::after{opacity:.1}
.i{font-size:17px;color:var(--on2);vertical-align:-3px;cursor:help;margin-left:2px}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:100dvh}
#rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:2px;padding:14px 12px 16px;border-right:1px solid var(--line2)}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand i{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--pri);color:var(--onpri);font:800 19px/1 var(--font);font-style:normal}
.nav{display:flex;align-items:center;gap:14px;height:48px;padding:0 16px;border-radius:24px;color:var(--on2);font-size:14.5px;font-weight:600;text-decoration:none;position:relative;isolation:isolate}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--tonal);transform:scaleX(.4);opacity:0;transition:transform .45s var(--spring),opacity .2s;z-index:-1}
.nav:hover{background:color-mix(in oklab,var(--on) 6%,transparent)}
.nav[aria-current=page]{color:var(--ontonal)}
.nav[aria-current=page]::before{transform:none;opacity:1}
.nav[aria-current=page] .ms{font-variation-settings:"FILL" 1,"wght" 500,"GRAD" 0,"opsz" 24}
.nav .cnt{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--on2)}
.nav .dot{position:absolute;left:34px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--bg)}
.rail-gap{flex:1} .rail-div{height:1px;background:var(--line);margin:8px 12px}
.rail-foot{font-size:12px;color:var(--on2);padding:10px 16px 0;line-height:1.45}

#main{min-width:0;padding:0 max(28px,env(safe-area-inset-right,0px)) 120px 28px;container:main/inline-size}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;gap:12px;height:var(--bar);background:var(--bg)}
.search{position:relative;flex:1;min-width:0;max-width:560px}
.search label{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-radius:24px;background:var(--c2);color:var(--on2);cursor:text;transition:background .2s}
.search label:hover{background:var(--c3)}
.search.open label{border-radius:24px 24px 0 0;background:var(--surf);box-shadow:0 2px 10px var(--shadow)}
.search input{all:unset;flex:1;min-width:0;width:100%;color:var(--on);font-size:15.5px}
.search input::placeholder{color:var(--on2)}
.sr{position:absolute;left:0;right:0;top:48px;z-index:20;background:var(--surf);border-radius:0 0 24px 24px;box-shadow:0 10px 24px var(--shadow);padding:6px 0 10px;margin:0;list-style:none}
.sr li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 12px;align-items:center;padding:9px 18px;cursor:pointer}
.sr li[aria-selected=true]{background:var(--sel)}
.sr .nm{font-weight:600} .sr .sy{font-size:12.5px;color:var(--on2)}
.sr .hd{padding:8px 18px 4px;cursor:default;display:block}
.sr .tags{display:flex;gap:6px;grid-row:1/3;grid-column:2}
.icb{width:44px;height:44px;border-radius:22px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--on2);flex:none;transition:border-radius .35s var(--spring),background .15s}
.icb:hover{background:color-mix(in oklab,var(--on) 8%,transparent);color:var(--on)}
.icb:active{border-radius:12px}
.fresh{font-size:13px;color:var(--on2);white-space:nowrap;margin-left:auto}
.fresh b{color:var(--on);font-weight:600}
@container main (max-width:760px){.fresh{display:none}}

/* atoms */
.chip{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:8px;font-size:12.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.v-sell{background:var(--loss);color:var(--onloss)} .v-weak{background:var(--warn);color:var(--onwarn)} .v-hold{background:var(--hold);color:var(--onhold)}
.v-watch{background:var(--watch);color:var(--onwatch)} .v-buy{background:var(--gain);color:var(--ongain)} .v-none{background:var(--c3);color:var(--on2)}
.v-trim{background:var(--warn);color:var(--onwarn)}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:24px;padding:2px 10px;border-radius:12px;font-size:12.5px;font-weight:600;background:var(--c2);color:var(--on)}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:20px;border:0;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:border-radius .35s var(--spring)}
.btn:active{border-radius:10px}
.btn .ms{font-size:20px}
.btn.f{background:var(--pri);color:var(--onpri)} .btn.t{background:var(--tonal);color:var(--ontonal)} .btn.o{background:transparent;color:var(--on);box-shadow:inset 0 0 0 1px var(--line)}
.btn.x{background:transparent;color:var(--pri);padding:0 12px}
.card{background:var(--surf);border:1px solid var(--line2);border-radius:24px}
.page-h{display:grid;gap:8px;padding:12px 2px 20px}
.page-h h1{font-size:clamp(28px,3cqi,40px)}
.page-h p{color:var(--on2);max-width:75ch;font-size:15.5px}
.secttl{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
.secttl h2{font-size:21px}
.secttl .n{font-weight:700;color:var(--on2)}
.secttl p{color:var(--on2);font-size:14px;margin-left:6px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.tile{background:var(--surf);border:1px solid var(--line2);border-radius:20px;padding:16px 18px;display:grid;gap:4px;align-content:start;text-decoration:none}
.tile .k{font-size:13px;color:var(--on2);font-weight:600}
.tile .v{font-size:26px;font-weight:700;line-height:1.15}
.tile .s{font-size:13px;color:var(--on2)}
.meter{height:8px;border-radius:4px;background:var(--c3);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--pri)}

/* call cards: why, chance, risks and money always visible */
.calls{display:grid;gap:14px}
.call{background:var(--surf);border:1px solid var(--line2);border-radius:24px;overflow:hidden}
.call.sell{border-left:5px solid var(--loss)} .call.weak{border-left:5px solid var(--warn)} .call.hold{border-left:5px solid var(--hold)} .call.watch,.call.buy{border-left:5px solid var(--pri)}
.call-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:16px 20px 6px}
.call-h .who{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.call-h h3{font-size:20px;font-weight:700}
.call-h h3 a{text-decoration:none} .call-h h3 a:hover{text-decoration:underline}
.call-h .meta{font-size:13.5px;color:var(--on2)}
.call-h .rt{display:flex;align-items:center;gap:16px}
.call-h .rt .lsp,.call-h .rt svg.sp{width:120px;height:36px}
.call .view{padding:2px 20px 12px;font-size:16.5px;font-weight:500;max-width:90ch}
.call-b{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line2)}
.call-b>div{padding:14px 20px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.call-b>div+div{border-left:1px solid var(--line2)}
.call-b h4{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--on2)}
.call-b ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.call-b .money{display:grid;gap:6px;font-size:14px}
.call-b .money div{display:flex;justify-content:space-between;gap:10px}
.call-b .money b{font-weight:650}
@container main (max-width:900px){.call-b{grid-template-columns:1fr 1fr} .call-b>div:first-child{grid-column:1/-1} .call-b>div:nth-child(2){border-left:0;border-top:1px solid var(--line2)} .call-b>div:nth-child(3){border-top:1px solid var(--line2)}}
@container main (max-width:560px){.call-b{grid-template-columns:1fr} .call-b>div+div{border-left:0;border-top:1px solid var(--line2)} .call-h{grid-template-columns:1fr} .call-h .rt .lsp,.call-h .rt svg.sp{display:none}}
.mini-calls{display:grid;background:var(--surf);border:1px solid var(--line2);border-radius:24px;padding:6px}
.mrow{display:grid;grid-template-columns:minmax(0,1.1fr) 110px 130px minmax(0,1.6fr) 28px;gap:14px;align-items:center;padding:10px 14px;border-radius:16px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.mrow .nm{font-weight:600} .mrow .sy{font-size:12.5px;color:var(--on2)}
.mrow .say{font-size:14px;color:var(--on2)}
.mrow .lsp,.mrow svg.sp{width:110px;height:30px}
@container main (max-width:900px){.mrow{grid-template-columns:minmax(0,1fr) 130px 28px} .mrow .lsp,.mrow svg.sp,.mrow .say{display:none}}
.chance{display:grid;gap:4px}
.chance .p{font-size:15px;font-weight:700}
.bigp{font-size:34px;font-weight:700;line-height:1}
.mini{position:relative;height:6px;border-radius:3px;background:var(--c3)}
.mini .z{position:absolute;left:0;top:0;bottom:0;border-radius:3px 0 0 3px;background:color-mix(in oklab,var(--loss) 45%,var(--c3))}
.mini .zb{left:auto;right:0;border-radius:0 3px 3px 0;background:color-mix(in oklab,var(--gain) 45%,var(--c3))}
.mini .u{position:absolute;top:-4px;width:3px;height:14px;margin-left:-1.5px;border-radius:2px;background:var(--on2)}
.mini .d{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 2px var(--surf)}
.more{display:flex;justify-content:center;padding:8px 0 2px}
.signals{display:flex;flex-wrap:wrap;gap:6px}

/* follow cards */
.fcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.fcard{background:var(--surf);border:1px solid var(--line2);border-radius:24px;padding:18px 20px;display:grid;gap:12px;align-content:start;text-decoration:none}
.fcard .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;align-items:start}
.fcard h3{font-size:18px}
.fcard .lsp,.fcard svg.sp{width:100%;height:56px}
.fcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.fcard dt{color:var(--on2)} .fcard dd{margin:0;font-weight:600}

/* grids (tables) */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.fchip{height:36px;padding:0 14px;border-radius:9px;border:0;box-shadow:inset 0 0 0 1px var(--line);background:none;cursor:pointer;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fchip[aria-pressed=true]{background:var(--tonal);color:var(--ontonal);box-shadow:none}
.qf{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);margin-left:auto;min-width:0}
.qf input{all:unset;width:200px;max-width:40vw;font-size:14px}
.grid{width:100%;border-collapse:separate;border-spacing:0;background:var(--surf);border-radius:20px;border:1px solid var(--line2)}
.grid th{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));z-index:3;background:var(--c1);text-align:left;font-size:12.5px;font-weight:700;color:var(--on2);padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
.grid th:first-child{border-top-left-radius:20px} .grid th:last-child{border-top-right-radius:20px}
.grid th button{all:unset;display:flex;align-items:center;gap:4px;padding:11px 12px;cursor:pointer;width:100%;box-sizing:border-box}
.grid th.r button{justify-content:flex-end}
.grid th .ms{font-size:16px} .grid th .ms:not(.i){display:none} .grid th[aria-sort] .ms{display:inline-block}
.grid td{padding:10px 12px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:middle}
.grid tbody tr:last-child td{border-bottom:0}
.grid tbody tr.r{cursor:pointer}
.grid tbody tr.r:hover td{background:var(--c1)}
.grid td.r{text-align:right}
.grid .nm{font-weight:600;max-width:220px}
.grid .sy{font-size:12.5px;color:var(--on2)}
.grid .lsp,.grid svg.sp{width:100px;height:30px}
.grid tr.gh td{background:var(--c2);font-weight:700;font-size:13.5px;cursor:default}
.grid tr.lots td{background:var(--c1);padding:4px 12px 14px 40px}
.grid .rm{opacity:0;transition:opacity .15s} .grid tr:hover .rm,.grid .rm:focus-visible{opacity:1}
@media (hover:none){.grid .rm{opacity:1}}
.lots table{border-collapse:collapse;font-size:13.5px;width:100%;max-width:640px}
.lots th,.lots td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line2);position:static;background:none}
@container main (max-width:1100px){.grid .h3{display:none}}
@container main (max-width:820px){.grid .h2{display:none}}
@container main (max-width:560px){.grid .h1{display:none} .grid .nm,.grid .sy{max-width:40cqi;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .grid td{padding:9px 8px} .grid th button{padding:10px 8px}}
.empty{padding:28px;text-align:center;color:var(--on2)}
.grid .signals{max-width:230px}
.grid .msg{font-size:13px;color:var(--on2);overflow-wrap:anywhere;max-width:90ch}
.call-h .meta{font-variant-numeric:tabular-nums}
.idea-why{display:grid;gap:3px;font-size:13.5px;color:var(--on2);max-width:60ch}
.idea-why b{color:var(--on);font-weight:600}

/* stock page */
.back{display:inline-flex;align-items:center;gap:6px;margin:6px 0 4px -8px}
.sp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;padding:6px 2px 18px}
.sp-head h1{font-size:clamp(30px,3.4cqi,44px)}
.sp-head .px{font-size:30px;font-weight:700;text-align:right}
.sp-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@container main (max-width:980px){.sp-grid{grid-template-columns:1fr}}
.pane{background:var(--surf);border:1px solid var(--line2);border-radius:24px;padding:20px 22px;display:grid;gap:18px;min-width:0}
.blk{display:grid;gap:8px}
.blk>h3{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--on2)}
.blk ul{margin:0;padding-left:18px;display:grid;gap:5px}
.bigview{font-size:19px;line-height:1.45;font-weight:500}
.why{border-left:4px solid var(--loss);padding:2px 0 2px 14px;display:grid;gap:4px}
.why.weak{border-color:var(--warn)}
.cb{position:relative;height:12px;border-radius:6px;background:var(--c3);margin:12px 0 6px}
.cb .zs{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:color-mix(in oklab,var(--loss) 40%,var(--c3))}
.cb .zb{position:absolute;right:0;top:0;bottom:0;border-radius:0 6px 6px 0;background:color-mix(in oklab,var(--gain) 40%,var(--c3))}
.cb .mid{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--on2);opacity:.55}
.cb .us{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;border-radius:2px;background:var(--on)}
.cb .pd{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--pri);box-shadow:0 0 0 3px var(--surf)}
.cbk{display:flex;justify-content:space-between;font-size:12.5px;color:var(--on2)}
.facts{display:grid;gap:0}

.rb{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--loss) 0 var(--sp),var(--gain) var(--sp) 100%);margin:26px 0 26px}

.rb .l{left:0;top:12px} .rb .r{right:0;top:12px} .rb .c{top:-26px;transform:translateX(-50%);font-weight:700}

@keyframes sk{to{background-position:-200% 0}}

/* market */
.sectors{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}

/* charts */
svg.pc,svg.sp,svg.bc{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}

.pc .la{fill:var(--pri);opacity:.1}
.pc .l50{fill:none;stroke:var(--l50);stroke-width:1.6}
.pc .l200{fill:none;stroke:var(--l200);stroke-width:1.6;stroke-dasharray:5 4}
.pc .lv{stroke-width:1.4;stroke-dasharray:2 3} .pc .lv.t{stroke:var(--gain)} .pc .lv.s{stroke:var(--loss)}
.pc .lvl{font:600 12px var(--font)} .pc .lvl.t{fill:var(--gain)} .pc .lvl.s{fill:var(--loss)}
.pc .end{fill:var(--pri);stroke:var(--surf);stroke-width:2.5}
.pc .xh,.sp .xh{stroke:var(--on);stroke-width:1;opacity:0} .pc .hd{fill:var(--pri);stroke:var(--surf);stroke-width:2.5;opacity:0}
.pc.on .xh,.sp.on .xh{opacity:.45} .pc.on .hd{opacity:1}
.sp path.l{fill:none;stroke-width:1.8;stroke-linejoin:round} .sp path.a{opacity:.12}
.sp.up path.l{stroke:var(--gain)} .sp.up path.a{fill:var(--gain)} .sp.dn path.l{stroke:var(--loss)} .sp.dn path.a{fill:var(--loss)}
.sp circle{stroke:var(--surf);stroke-width:2} .sp.up circle{fill:var(--gain)} .sp.dn circle{fill:var(--loss)}
.bc rect{rx:3px} .bc .pos{fill:var(--gain)} .bc .neg{fill:var(--loss)} .bc rect.on{opacity:.75}
.lsp{display:block;height:30px;width:100px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--on2)}

#tip{position:fixed;z-index:90;pointer-events:none;background:var(--on);color:var(--bg);padding:9px 13px;border-radius:10px;font-size:13.5px;line-height:1.45;max-width:320px;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .2s var(--ease)}

/* feedback FAB, dialog, toasts, more sheet */
#fab{position:fixed;right:28px;bottom:28px;z-index:30;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--tonal);color:var(--ontonal);font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 14px var(--shadow);transition:border-radius .4s var(--spring)}

/* medium: icon rail */

/* call rows: verdict | name and one plain sentence | trend | chance | money | hide */

/* v2 additions on top of the deployed r10 stylesheet. Same tokens, same shapes. */
:root{--yel:#E8A800;--onyel:#2A1700;--yelbg:#FFF4CC}

.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
/* list 30 / detail 70 */
.lp{grid-template-columns:minmax(0,30fr) minmax(0,70fr)}

.lp-pane{display:block;overflow:auto;overscroll-behavior:contain;padding:0}
.dt{display:grid;gap:0}
.dt>.dsec{padding:18px 22px;border-bottom:1px solid var(--line2);min-width:0;display:grid;gap:12px}
.dt>.dsec:last-child{border-bottom:0}
.dt.pg{background:var(--surf);border:1px solid var(--line2);border-radius:24px;overflow:hidden}
.dt .hd1{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}

 if((x=el("[data-hide]"))){const [id,d]=x.dataset.hide.split(":");HIDDEN.add(id);render();toast(`${esc(BY[id].nm)} hidden${d==="30"?" for 30 days":" for good"}. <a href="#" data-unhide="${id}">Undo</a>`);return}
 if((x=el("[data-unhide]"))){e.preventDefault();HIDDEN.delete(x.dataset.unhide);toasts=toasts.filter(t=>!t.html.includes("data-unhide"));paintToasts();render();return}
 if((x=el("[data-chip]"))){const [k,v]=x.dataset.chip.split(":");CHIP[k]=v;render();return}
 if((x=el("[data-z]"))){const id=el("[data-chart]").dataset.chart,v=VIEW[id],c=(v.a+v.b)/2,h=(v.b-v.a)/2,k=x.dataset.z;
  if(k==="reset")VIEW[id]={a:N-252,b:N-1};else{const f=k==="in"?.7:1.4;let a=c-h*f,b=c+h*f;if(b-a<10){a=c-5;b=c+5}if(b>N-1){a-=b-(N-1);b=N-1}if(a<0){b-=a;a=0}VIEW[id]={a,b:Math.min(b,N-1)}}render();return}
 if((x=el("[data-pick]"))){location.hash="stock-"+x.dataset.pick;$("#q").value="";$("#sr").hidden=true;return}
 if((x=el("[data-sel]"))){const [k,id]=x.dataset.sel.split(":");if(innerWidth<=900){seen.add(id);location.hash="stock-"+id;return}return selectRow(k,id)}
 if(el(".markall")){unseenIds().forEach(i=>seen.add(i));render();return}
 if(el("[data-layers]")){LO=!LO;render();return}
 if((x=el(".rng"))){const s=BY[x.closest("[data-chart]").dataset.chart];VIEW[s.id]={a:N-RN[x.dataset.r],b:N-1};render();return}
 if((x=el("[data-tg]"))){TG[x.dataset.tg]=TG[x.dataset.tg]?0:1;render();return}
 if(el(".shut")){const b=el(".chart");b.classList.remove("isfull");drawChart(b,BY[b.dataset.chart]);return}
 if(el(".full")){const b=el(".sec").querySelector(".chart");b.classList.toggle("isfull");drawChart(b,BY[b.dataset.chart]);return}
 if((x=el(".update,.analyse"))){const s=BY[x.dataset.id],j=newJob({t:(x.classList.contains("update")?"Update forecast: ":"Analyse ")+s.nm,kind:"Analyse",ref:s.id});runJob(j,()=>{s.ood=0;CH.push({id:s.id,at:"Just now",from:"Keep",to:VL[s.v],pf:s.ch6,pt:s.ch6,why:"The forecast you asked for is ready."});seen.delete(s.id);toast(`${esc(s.nm)} forecast is ready – <a href="#stock-${s.id}">Open</a>`,"done")});render();return}
 if(el(".retry")){const j=JOBS.find(j=>j.state==="failed");j.state="running";j.t=j.t;j.steps=STEPS;j.started="just now";j.left="about 3 min left";runJob(j,()=>{const s=BY[j.ref];if(s)s.ood=0;toast(`${esc(s?.nm||j.t)} forecast is ready – <a href="#stock-${j.ref}">Open</a>`,"done")});render();return}
 if(el("#top-sync")){if(JOBS.some(j=>j.state==="running"&&j.kind==="Sync"))return;const j=newJob({t:"Sync from Zerodha",kind:"Sync",steps:["Queued","Sign in","Holdings","Trades","Done"]});runJob(j,()=>toast('Sync finished – <a href="#jobs">Open</a>',"done"));refreshBar();return}
 if(el("[data-fbsend]")){const t=$("#fbt").value.trim();if(!t){$("#fbt").focus();return}const a={id:"a"+(++jid),t,at:"Just now",job:null},j=newJob({t:"Build: "+t.slice(0,48),kind:"Feedback",ask:a.id,steps:["Queued","Plan","Build","Test","Publish"]});a.job=j.id;ASKS.unshift(a);runJob(j,()=>toast('Your change is live – <a href="#feedback">See it</a>',"done"));render();return}
 if((x=el(".del"))){const id=x.closest(".fbitem").dataset.ask;HID.add(id);render();toast(`Removed. <a href="#" data-undo="${id}">Undo</a>`);return}
 if((x=el("[data-undo]"))){e.preventDefault();HID.delete(x.dataset.undo);toasts=toasts.filter(t=>!t.html.includes("data-undo"));paintToasts();render();return}
 if((x=el("[data-f]"))){const k=route()[0],f=FILT[k]??={};f[x.dataset.f]=!f[x.dataset.f];render();return}
 if((x=el("[data-scope]"))){SCOPE[route()[0]]=x.dataset.scope;render();return}
 if((x=el("[data-mode]"))){const [k,m]=x.dataset.mode.split(":");MODE[k]=m;render();return}
 if((x=el("tr[data-open]"))){location.hash="stock-"+x.dataset.open;return}
 if((x=el(".lgh"))){const g=x.closest(".lg");g.dataset.open=g.dataset.open==="true"?"false":"true";x.setAttribute("aria-expanded",g.dataset.open);return}
 if(el("#lang")){LANG=LANG==="en"?"bn":"en";document.documentElement.lang=LANG;renderBar();render();return}
 if(el("#theme")){const d=document.documentElement;d.dataset.theme=(d.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark"?"light":"dark";renderBar();render();return}
 if((x=el("[data-more-nav]"))){document.body.insertAdjacentHTML("beforeend",`<div id="scrim"></div><nav id="more"><div class="grab"></div>${[...NAV,...NAVB,...NAV2].filter(n=>n[4]==="desk").map(([k,ic,l])=>`<a class="nav" href="#${k}"><span class="ms">${ic}</span><span>${l}</span></a>`).join("")}</nav>`);return}
 if(el("#scrim")||el("#more a")){$("#more")?.remove();$("#scrim")?.remove();return}
 if(LO&&!el(".lyr")){LO=false;render()}
 if(!el(".search"))$("#sr")&&($("#sr").hidden=true)});
document.addEventListener("input",e=>{if(e.target.id==="q")searchShow();if(e.target.id==="qf"){QF[e.target.dataset.key]=e.target.value;const p=e.target.selectionStart;render();const f=$("#qf");f.focus();f.setSelectionRange(p,p)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const b=$(".chart.isfull");if(b){b.classList.remove("isfull");drawChart(b,BY[b.dataset.chart])}else if($("#sr")&&!$("#sr").hidden){$("#sr").hidden=true}}
 if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement?.tagName)){e.preventDefault();$("#q").focus()}
 if(e.key==="Enter"&&e.target.matches(".lrow,tr[data-open]"))e.target.click();
 if(e.key==="Enter"&&e.target.id==="q"){const f=$("#sr [data-pick]");f&&f.click()}});
addEventListener("hashchange",()=>{$("#more")?.remove();$("#scrim")?.remove();render();scrollTo(0,0)});
renderBar();favicon();render();

</script>
